name: Build variant images

on:
  push:
    branches: [main]
    paths: [ci-trigger.txt]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image libraries
        run: pip install pillow numpy scipy
      - name: Decode masters and originals
        run: |
          mkdir -p masters ci-originals
          for f in ci-payload/master-*.b64; do n=$(basename "$f" .b64); base64 -d "$f" > "masters/$n.png"; done
          for id in 7000 10000; do base64 -d "ci-payload/original-$id.b64" > "ci-originals/$id.png"; done
          ls masters | wc -l
      - name: Build variants 1571-10000
        env:
          SPOXY_ORIGINALS_DIR: ci-originals
        run: python3 scripts/build_variants.py --start 1571 --end 10000
      - name: Commit results to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add masters collection-master-512/images
          git rm -r --quiet ci-payload ci-trigger.txt
          git commit -m "Add AI trait-variant images 1571-10000 (CI build) and master bases"
          git push
